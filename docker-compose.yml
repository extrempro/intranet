# Betrieb hinter dem NetBird Reverse Proxy, Bereitstellung per Arcane Git-Sync.
# Werte kommen aus .env (Vorlage: .env.example). Keine Secrets ins Repo.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD fehlt in .env}
      ORIGIN: ${ORIGIN}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-21M}
      FILES_DIR: /data/files
      BACKUP_DIR: /data/backups
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_ACCESS_GROUP_ID: ${ENTRA_ACCESS_GROUP_ID:-}
      ENTRA_ADMIN_GROUP_ID: ${ENTRA_ADMIN_GROUP_ID:-}
      MAIL_SENDER: ${MAIL_SENDER:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      INITIAL_TENANT_NAME: ${INITIAL_TENANT_NAME:-}
      INITIAL_TENANT_SHORT: ${INITIAL_TENANT_SHORT:-}
      INITIAL_TENANT_DOMAINS: ${INITIAL_TENANT_DOMAINS:-}
      INITIAL_TENANT_ACCENT: ${INITIAL_TENANT_ACCENT:-}
      INITIAL_TENANT_ACCENT_DARK: ${INITIAL_TENANT_ACCENT_DARK:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Verschlüsselte Dateien (Anhänge, PDFs, Fotos) – sichert der Dienst backup
      - files-data:/data/files
      # Nur lesend: Zustand der Sicherungen für Verwaltung → System
      - backup-data:/data/backups:ro
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Tägliche Sicherung von Datenbank und Dateien (backup/README.md)
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Fehlt der Wert, meldet die Sicherung das unter Verwaltung → System
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_TIME: ${BACKUP_TIME:-01:15}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      RESTORE_TEST_DAYS: ${RESTORE_TEST_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      # Wiederherstellungstest und unverschlüsselter Zwischenstand nur im Arbeitsspeicher
      - /tmp
    volumes:
      - files-data:/data/files:ro
      - backup-data:/backups
    cap_drop:
      - ALL
    cap_add:
      # Dateien der Anwendung lesen, Test-Datenbank als Benutzer postgres starten
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  # Nur bei Bedarf (backup/README.md): ersetzt Datenbank und Dateien durch eine Sicherung
  wiederherstellen:
    build: ./backup
    profiles: ['wiederherstellen']
    entrypoint: ['/usr/local/bin/wiederherstellen.sh']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - files-data:/data/files
      - backup-data:/backups:ro
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
  files-data:
  # Auf einen anderen Datenträger legen bzw. regelmäßig nach außen kopieren
  backup-data:
