name: Release

# Legt nach dem Merge für eine neue Version (package.json) ein GitHub-Release an.
# Der Text kommt aus CHANGELOG.md (gleicher Eintrag wie „Neu im Intranet“).
# Dazu baut er die Images ghcr.io/extrempro/intranet:<Version> und
# ghcr.io/extrempro/intranet-backup:<Version> und ghcr.io/extrempro/intranet-video:<Version>
# (bei der neuesten Version auch :latest).
# Von Hand (Actions → Release → Run workflow) lässt sich auch ein Release für
# eine frühere Version an einem bestimmten Commit nachtragen.
on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version aus CHANGELOG.md, z. B. 0.2.0 (leer = aktuelle Version)'
        required: false
      commit:
        description: 'Commit für den Tag (leer = neuester Stand von main)'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Release anlegen, falls es die Version noch nicht gibt
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EINGABE_VERSION: ${{ inputs.version }}
          EINGABE_COMMIT: ${{ inputs.commit }}
        run: |
          AKTUELL=$(node -p "require('./package.json').version")
          V=${EINGABE_VERSION:-$AKTUELL}
          ZIEL=${EINGABE_COMMIT:-$GITHUB_SHA}
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Ungültige Version: $V"; exit 1; fi
          if ! [[ "$ZIEL" =~ ^[0-9a-f]{7,40}$ ]]; then echo "Ungültiger Commit: $ZIEL"; exit 1; fi
          LATEST=true
          if [ "$V" != "$AKTUELL" ]; then LATEST=false; fi
          {
            echo "version=$V"
            echo "commit=$ZIEL"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V gibt es schon."
            exit 0
          fi
          node scripts/release-notes.mjs "$V" > notes.md
          TITEL=$(node scripts/release-notes.mjs "$V" --titel)
          # Ältere Versionen nicht als „neueste“ markieren
          gh release create "v$V" --target "$ZIEL" --title "$V · $TITEL" --notes-file notes.md --latest=$LATEST
      # Stückliste der Abhängigkeiten (SBOM, CycloneDX) zum Release (ASVS 5.0 V15.1.2)
      - name: SBOM anhängen
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.release.outputs.version }}
          ZIEL: ${{ steps.release.outputs.commit }}
        run: |
          git fetch -q --depth=1 origin "$ZIEL"
          git checkout -q "$ZIEL"
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "intranet-$V.sbom.cdx.json"
          gh release upload "v$V" "intranet-$V.sbom.cdx.json" --clobber
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      latest: ${{ steps.release.outputs.latest }}

  images:
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        include:
          - name: intranet
            context: .
          - name: intranet-backup
            context: backup
          - name: intranet-video
            context: video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags festlegen
        id: tags
        env:
          V: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
          NAME: ${{ matrix.name }}
        run: |
          BILD="ghcr.io/extrempro/$NAME"
          TAGS="$BILD:$V"
          if [ "$LATEST" = "true" ]; then TAGS="$TAGS,$BILD:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
