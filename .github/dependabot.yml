# npm-Pakete aktualisiert der Workflow „Abhängigkeiten aktualisieren“ selbst.
# Dependabot kümmert sich nur um GitHub Actions und die Docker-Basis-Images
# (App und Sicherung), jeweils gebündelt in einem Pull Request pro Monat.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/', '/backup']
    schedule:
      interval: monthly
    groups:
      basis-images:
        patterns: ['*']
